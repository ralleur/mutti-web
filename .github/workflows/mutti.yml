name: Mutti Web
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          docker run --rm -v "$PWD:/app" -w /app node:26.7.0-bookworm-slim@sha256:4db36457f406501e6f608802e5da617e5fbd0e80b75901b6a09de1ae5a667d32 sh -c 'npm ci --no-audit --no-fund && npm run build:check && npx vitest run src/mutti/locale.test.ts && npm run build:production'
